name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Accepts the SDK licenses; AGP then downloads the platform / build-tools it needs by itself.
      #
      # Why @v4 and `packages: ''`: @v3 installs Google's old "tools" package by default, and Google no longer
      # serves it, so every run died right here with "Failed to find package 'tools'" before Gradle even
      # started (nothing to do with the app's code). @v4 dropped "tools" from its defaults, and the empty
      # `packages` skips installing any extra package at all: this build does not need platform-tools (adb),
      # so there is nothing left in this step that a removed SDK package could break again.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # No committed Gradle wrapper needed - this downloads and caches a
      # pinned Gradle distribution instead of relying on ./gradlew.
      # Pinned (not "current") because AGP 9.1.1's own compatibility table
      # lists 9.3.1 as both its minimum AND default Gradle version. AGP's
      # built-in-Kotlin feature (which replaced org.jetbrains.kotlin.android)
      # is a tight, version-sensitive integration with Gradle internals, not
      # a stable public API - "current" drifts forward on every run, and by
      # the time it reached Gradle 9.7.0 that drift broke the Compose
      # compiler plugin ("...ComposePluginRegistrar is incompatible with the
      # current version of the compiler" / AbstractMethodError: getPluginId()),
      # even though the Kotlin/Compose-compiler versions in libs.versions.toml
      # were themselves correctly matched to each other.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # A fresh GitHub runner has no ~/.android/debug.keystore, so every run would generate a brand-new
      # random debug key, and Android refuses to install an APK over one signed with a different key
      # (you had to uninstall first, losing your PIN and bookmarks). Caching the key keeps it stable.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Runs after the APK has been uploaded, so a failing test can never stop you from getting the APK.
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
