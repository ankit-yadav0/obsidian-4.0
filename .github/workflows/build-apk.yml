name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs/updates the Android SDK components this project needs,
      # and accepts the SDK licenses.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # No committed Gradle wrapper needed - this downloads and caches a
      # current Gradle distribution instead of relying on ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
